name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (apps/web)
        run: npm --prefix apps/web run lint

      - name: Typecheck (packages/core)
        run: npm --prefix packages/core run typecheck

      - name: Typecheck (packages/exercises)
        run: npm --prefix packages/exercises run typecheck

      - name: Test (packages/core)
        run: npm run test:core

      - name: Test (packages/data)
        run: npm run test:data

      - name: Test (packages/exercises)
        run: npm run test:exercises

      - name: Test (apps/web)
        run: npm run test:web

      - name: Write test-only .dev.vars (Mission 14 -- ADMIN_SECRET_HASH for wrangler-backed tests)
        # Not a real secret: SHA-256 of the literal string "test-admin-secret"
        # (see functions/__tests__/testServer.js). .dev.vars is gitignored
        # (local-only convention), so a fresh CI checkout needs it written
        # here before anything spawns wrangler pages dev / d1 execute.
        run: |
          echo "ADMIN_SECRET_HASH=b0413b34669b4c59b09c34129667cfbb4ce47a9bbf49785b5a8ae2d7858bea24" > .dev.vars
          echo "SESSION_SECRET=test-session-secret-never-use-in-prod" >> .dev.vars
          echo "MAIL_DEV_ECHO=1" >> .dev.vars

      - name: Test (functions -- Mission 14 licensing, real wrangler + local D1)
        run: npm run test:functions

      - name: Install Playwright browsers
        run: npx --prefix apps/web playwright install --with-deps chromium

      - name: E2E (apps/web)
        # Mission 14 Etape 3: runs against a real wrangler pages dev + local
        # D1 now (see playwright.config.js), seeded with a fixture license
        # for GDS-TEST-0001 (scripts/seed-e2e-test-license.sql) -- not a
        # client-side fallback, not a real pilot key.
        run: npm run test:e2e

      - name: E2E admin (Mission 14 -- real wrangler + local D1, not vite preview)
        run: npm run test:e2e:admin
